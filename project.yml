# Xcode プロジェクトは XcodeGen で生成します:  xcodegen generate
name: TrotWalk
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    # 自分の Apple Developer チーム ID と bundle ID に変えてください
    DEVELOPMENT_TEAM: ""
    APP_BUNDLE_ID: com.example.trotwalk
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

packages:
  TrotWalkCore:
    path: TrotWalkCore

targets:
  TrotWalk:
    type: application
    platform: iOS
    sources:
      - TrotWalk
      - Shared
    dependencies:
      - package: TrotWalkCore
      - target: TrotWalkWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    entitlements:
      path: TrotWalk/TrotWalk.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: TrotWalk/Info.plist
      properties:
        CFBundleDisplayName: Trot&Walk
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: 心拍数と安静時心拍、年齢を読み取り、速歩と緩歩の目安を計算します。
        NSHealthUpdateUsageDescription: ウォーキングのワークアウトをフィットネスとヘルスケアに保存します。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  TrotWalkWatch:
    type: application
    platform: watchOS
    sources:
      - path: TrotWalk Watch App
      - Shared
    dependencies:
      - package: TrotWalkCore
    entitlements:
      path: TrotWalk Watch App/TrotWalkWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: TrotWalk Watch App/Info.plist
      properties:
        CFBundleDisplayName: Trot&Walk
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: 心拍数と安静時心拍、年齢を読み取り、速歩と緩歩の目安を計算します。
        NSHealthUpdateUsageDescription: ウォーキングのワークアウトをフィットネスとヘルスケアに保存します。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: TrotWalkWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

schemes:
  TrotWalk:
    build:
      targets:
        TrotWalk: all
        TrotWalkWatch: all
    run:
      config: Debug
  TrotWalkWatch:
    build:
      targets:
        TrotWalkWatch: all
    run:
      config: Debug
